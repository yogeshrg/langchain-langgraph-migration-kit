version: "3.8"

services:
  langchain-langgraph-migration-kit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: langchain-langgraph-migration-kit
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  langchain_langgraph_migration_kit_data:
